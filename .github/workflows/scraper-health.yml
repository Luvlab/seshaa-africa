name: Scraper Health Check

on:
  schedule:
    # Runs every day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  health-check:
    name: OSM Scraper Health
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Dry-run scrape (5 cities)
        run: npx ts-node src/scraper/osm.ts --limit 5 --dry-run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Report DB totals
        run: |
          npx ts-node -e "
          import 'dotenv/config';
          import prisma from './src/db';
          async function main() {
            const total = await prisma.listing.count({ where: { osmId: { not: null } } });
            const countries = await prisma.listing.groupBy({
              by: ['country'],
              where: { osmId: { not: null } },
              _count: { id: true },
              orderBy: { _count: { id: 'desc' } },
              take: 10,
            });
            console.log('Total OSM listings:', total);
            for (const c of countries) {
              console.log(' -', c.country.padEnd(25), c._count.id);
            }
            await prisma.\$disconnect();
          }
          main();"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
